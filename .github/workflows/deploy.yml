# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      # With a custom domain the site lives at the top of the address and gets the real build.
      - if: steps.pages.outputs.base_path == ''
        run: npm run build
        env:
          # To use a domain other than worldtripmap.com, set a repository variable named
          # SITE_URL (Settings -> Secrets and variables -> Actions -> Variables).
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}', steps.pages.outputs.host) }}
      # Without one it lives in a sub-folder (user.github.io/repo/), where only the preview copy
      # works: relative addresses, marked as a preview, hidden from search engines.
      - if: steps.pages.outputs.base_path != ''
        run: npm run preview:build && rm -rf dist && mv dist-preview dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
